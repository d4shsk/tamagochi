<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SlowDown - Регистрация</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #36393f;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            background: #2f3136;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
            width: 100%;
            max-width: 400px;
        }
        h1 {
            text-align: center;
            color: #ff7eb9;
            margin-bottom: 10px;
            font-size: 2.5em;
            text-shadow: 0 0 10px rgba(255, 126, 185, 0.3);
        }
        .subtitle {
            text-align: center;
            color: #b9bbbe;
            margin-bottom: 30px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #dcddde;
            font-weight: 500;
            font-size: 12px;
            text-transform: uppercase;
        }
        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 12px 15px;
            border: none;
            border-radius: 4px;
            background: #202225;
            color: #dcddde;
            font-size: 16px;
            transition: box-shadow 0.2s;
        }
        input:focus {
            outline: none;
            box-shadow: 0 0 0 2px #ff7eb9;
        }
        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #ff7eb9 0%, #a15eff 100%);
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(255, 126, 185, 0.4);
        }
        .links {
            text-align: center;
            margin-top: 20px;
            color: #72767d;
            font-size: 14px;
        }
        .links a {
            color: #ff7eb9;
            text-decoration: none;
        }
        .links a:hover {
            text-decoration: underline;
        }
        .pet-icon {
            text-align: center;
            font-size: 60px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="pet-icon">🥚</div>
        <h1>Регистрация</h1>
        <p class="subtitle">Создай аккаунт для начала игры!</p>
        
        <form action="/register" method="post">
            <div class="form-group">
                <label for="username">Логин</label>
                <input type="text" id="username" name="username" required minlength="3">
            </div>
            <div class="form-group">
                <label for="password">Пароль</label>
                <input type="password" id="password" name="password" required minlength="4">
            </div>
            <button type="submit">Зарегистрироваться</button>
        </form>
        
        <div class="links">
            <p>Уже есть аккаунт? <a href="/">Войти</a></p>
        </div>
    </div>
</body>
</html>
