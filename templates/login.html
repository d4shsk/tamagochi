<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход - SERUNCHIK</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #03010b;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-image: radial-gradient(circle at 50% 0%, #1a0b2e 0%, #03010b 70%);
        }
        
        .container {
            background: rgba(16, 12, 26, 0.6);
            padding: 50px 40px;
            border-radius: 20px;
            border: 1px solid rgba(255, 66, 165, 0.1);
            backdrop-filter: blur(10px);
            box-shadow: 0 0 40px rgba(0,0,0,0.5), 0 0 20px rgba(177, 66, 245, 0.1);
            width: 100%;
            max-width: 450px;
            text-align: center;
        }

        .logo-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin-bottom: 20px;
        }
        .logo-icon {
            width: 32px;
            height: 32px;
            border: 2px solid #ff42a5;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }
        .logo-icon::before {
            content: '';
            position: absolute;
            top: 6px;
            left: 6px;
            width: 4px;
            height: 4px;
            background: #ff42a5;
            border-radius: 50%;
            box-shadow: 12px 0 0 #ff42a5;
        }
        .logo-icon::after {
            content: '';
            position: absolute;
            bottom: 6px;
            left: 10px;
            width: 8px;
            height: 3px;
            background: #ff42a5;
            border-radius: 3px;
        }
        .logo-text {
            font-weight: 700;
            font-size: 1.5rem;
            color: #ff42a5;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .subtitle {
            color: #8a8a9d;
            margin-bottom: 40px;
            font-size: 1.1rem;
        }

        .form-group {
            margin-bottom: 25px;
            text-align: left;
        }
        label {
            display: block;
            margin-bottom: 10px;
            color: #c4c4d4;
            font-weight: 500;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 15px 20px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            color: #ffffff;
            font-size: 1rem;
            font-family: inherit;
            transition: all 0.3s ease;
        }
        input:focus {
            outline: none;
            border-color: #ff42a5;
            background: rgba(255, 66, 165, 0.05);
            box-shadow: 0 0 15px rgba(255, 66, 165, 0.2);
        }

        button {
            width: 100%;
            padding: 16px;
            margin-top: 10px;
            background: rgba(255, 66, 165, 0.1);
            border: 2px solid #ff42a5;
            color: #ff42a5;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 0 15px rgba(255, 66, 165, 0.2), inset 0 0 10px rgba(255, 66, 165, 0.1);
            transition: all 0.3s ease;
        }
        button:hover {
            background: rgba(255, 66, 165, 0.2);
            box-shadow: 0 0 25px rgba(255, 66, 165, 0.4), inset 0 0 15px rgba(255, 66, 165, 0.2);
            transform: translateY(-2px);
        }

        .links {
            margin-top: 30px;
            color: #6b6b7b;
            font-size: 0.95rem;
        }
        .error-message {
            background: rgba(255, 66, 66, 0.1);
            border: 1px solid #ff4242;
            color: #ff4242;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 25px;
            font-size: 0.95rem;
            text-align: center;
        }
        .links a {
            color: #00f0ff;
            text-decoration: none;
            transition: color 0.3s ease;
        }
        .links a:hover {
            color: #ffffff;
            text-shadow: 0 0 10px #00f0ff;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo-container">
            <div class="logo-icon"></div>
            <div class="logo-text">SERUNCHIK</div>
        </div>
        <p class="subtitle">Вход в систему</p>
        
        {% if error %}
        <div class="error-message">
            Неверный логин или пароль
        </div>
        {% endif %}
        
        <form action="/token" method="post">
            <div class="form-group">
                <label for="username">Логин</label>
                <input type="text" id="username" name="username" required placeholder="Введите логин">
            </div>
            <div class="form-group">
                <label for="password">Пароль</label>
                <input type="password" id="password" name="password" required placeholder="Введите пароль">
            </div>
            <button type="submit">Войти</button>
        </form>
        
        <div class="links">
            <p>Нет аккаунта? <a href="/register">Зарегистрироваться</a></p>
        </div>
    </div>
</body>
</html>
